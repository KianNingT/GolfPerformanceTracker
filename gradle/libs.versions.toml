[versions]
# Kotlin & Core
kotlin                      = "2.0.0"
ksp                         = "2.0.0-1.0.21"
agp                         = "8.6.0"
coreKtx                     = "1.13.1"
coroutines                  = "1.8.1"

# Compose
composeBom                  = "2026.06.00"
activityCompose             = "1.9.0"
navigationCompose           = "2.7.7"
lifecycleRuntimeKtx         = "2.8.3"

# DI
hilt                        = "2.51.1"
hiltNavigationCompose       = "1.2.0"

# Network
retrofit                    = "2.11.0"
okhttp                      = "4.12.0"
moshi                       = "1.15.1"

# Room
room                        = "2.6.1"

# Image Loading
coil                        = "2.6.0"

# Paging
paging                      = "3.3.0"
pagingCompose               = "3.3.0"

# DataStore
datastore                   = "1.1.1"

# Logging
timber                      = "5.0.1"

# Splash Screen
splashscreen                = "1.0.1"

# Testing
junit                       = "4.13.2"
mockk                       = "1.13.11"
turbine                     = "1.1.0"
truth                       = "1.4.2"
androidxTestExtJunit        = "1.2.1"
androidxTestEspresso        = "3.6.1"
androidxTestCore            = "1.6.1"
archCoreTesting             = "2.2.0"


[libraries]
# Core
androidx-core-ktx           = { group = "androidx.core",        name = "core-ktx",                      version.ref = "coreKtx" }
kotlinx-coroutines-core     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",      version.ref = "coroutines" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",   version.ref = "coroutines" }

# Compose BOM
compose-bom                 = { group = "androidx.compose",     name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",  name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",  name = "ui-graphics" }
compose-ui-tooling          = { group = "androidx.compose.ui",  name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",  name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime             = { group = "androidx.compose.runtime", name = "runtime" }
compose-foundation          = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation           = { group = "androidx.compose.animation", name = "animation" }

# Activity & Lifecycle
activity-compose            = { group = "androidx.activity",    name = "activity-compose",              version.ref = "activityCompose" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntimeKtx" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",   name = "lifecycle-runtime-compose",     version.ref = "lifecycleRuntimeKtx" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-compose",   version.ref = "lifecycleRuntimeKtx" }

# Navigation
navigation-compose          = { group = "androidx.navigation",  name = "navigation-compose",            version.ref = "navigationCompose" }

# Hilt DI
hilt-android                = { group = "com.google.dagger",    name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",    name = "hilt-compiler",                 version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",        name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }

# Network - Retrofit
retrofit-core               = { group = "com.squareup.retrofit2", name = "retrofit",                    version.ref = "retrofit" }
retrofit-moshi              = { group = "com.squareup.retrofit2", name = "converter-moshi",             version.ref = "retrofit" }

# Network - OkHttp
okhttp-core                 = { group = "com.squareup.okhttp3", name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3", name = "logging-interceptor",           version.ref = "okhttp" }

# Network - Moshi
moshi-core                  = { group = "com.squareup.moshi",   name = "moshi",                         version.ref = "moshi" }
moshi-kotlin                = { group = "com.squareup.moshi",   name = "moshi-kotlin",                  version.ref = "moshi" }
moshi-codegen               = { group = "com.squareup.moshi",   name = "moshi-kotlin-codegen",          version.ref = "moshi" }

# Room
room-runtime                = { group = "androidx.room",        name = "room-runtime",                  version.ref = "room" }
room-ktx                    = { group = "androidx.room",        name = "room-ktx",                      version.ref = "room" }
room-compiler               = { group = "androidx.room",        name = "room-compiler",                 version.ref = "room" }
room-paging                 = { group = "androidx.room",        name = "room-paging",                   version.ref = "room" }

# Image Loading
coil-compose                = { group = "io.coil-kt",           name = "coil-compose",                  version.ref = "coil" }

# Paging
paging-runtime              = { group = "androidx.paging",      name = "paging-runtime",                version.ref = "paging" }
paging-compose              = { group = "androidx.paging",      name = "paging-compose",                version.ref = "pagingCompose" }

datastore-preferences        = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Logging
timber                      = { group = "com.jakewharton.timber", name = "timber",                      version.ref = "timber" }

# Splash Screen
splashscreen                = { group = "androidx.core",        name = "core-splashscreen",             version.ref = "splashscreen" }

# Testing - Unit
test-junit                  = { group = "junit",                name = "junit",                         version.ref = "junit" }
test-mockk                  = { group = "io.mockk",             name = "mockk",                         version.ref = "mockk" }
test-coroutines             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",      version.ref = "coroutines" }
test-turbine                = { group = "app.cash.turbine",     name = "turbine",                       version.ref = "turbine" }
test-truth                  = { group = "com.google.truth",     name = "truth",                         version.ref = "truth" }
#noinspection SimilarGradleDependency
test-arch-core              = { group = "androidx.arch.core",   name = "core-testing",                  version.ref = "archCoreTesting" }

# Testing - Android Instrumented
androidtest-ext-junit       = { group = "androidx.test.ext",    name = "junit",                         version.ref = "androidxTestExtJunit" }
androidtest-espresso        = { group = "androidx.test.espresso", name = "espresso-core",               version.ref = "androidxTestEspresso" }
androidtest-core            = { group = "androidx.test",        name = "core-ktx",                      version.ref = "androidxTestCore" }
androidtest-room            = { group = "androidx.room",        name = "room-testing",                  version.ref = "room" }
androidtest-mockk           = { group = "io.mockk",             name = "mockk-android",                 version.ref = "mockk" }
#noinspection SimilarGradleDependency
androidtest-arch-core       = { group = "androidx.arch.core",   name = "core-testing",                  version.ref = "archCoreTesting" }

paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }


[plugins]
android-application         = { id = "com.android.application",                 version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",             version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp",                  version.ref = "ksp" }
hilt                        = { id = "com.google.dagger.hilt.android",           version.ref = "hilt" }